name: Terraform and Ansible Deployment

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - "ansible/**"
      - "app/**"
      - "requirements.txt"
      - ".github/workflows/deploy.yaml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Terraform and Ansible
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_AZUREAD: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Create Terraform variables
        shell: bash
        env:
          TF_LOCATION: ${{ vars.TF_LOCATION }}
          TF_RESOURCE_GROUP_NAME: ${{ vars.TF_RESOURCE_GROUP_NAME }}
          TF_VM_NAME: ${{ vars.TF_VM_NAME }}
          TF_VM_SIZE: ${{ vars.TF_VM_SIZE }}
          TF_ADMIN_USERNAME: ${{ vars.TF_ADMIN_USERNAME }}
          SSH_PUBLIC_KEY: ${{ vars.AZURE_SSH_PUBLIC_KEY }}
        run: |
          set -euo pipefail

          printf '%s\n' "$SSH_PUBLIC_KEY" > "$RUNNER_TEMP/azure-vm.pub"

          cat > terraform.tfvars <<EOF
          subscription_id     = "${ARM_SUBSCRIPTION_ID}"
          location            = "${TF_LOCATION}"
          resource_group_name = "${TF_RESOURCE_GROUP_NAME}"
          vm_name             = "${TF_VM_NAME}"
          vm_size             = "${TF_VM_SIZE}"
          admin_username      = "${TF_ADMIN_USERNAME}"
          ssh_public_key_path = "$RUNNER_TEMP/azure-vm.pub"
          EOF

      - name: Configure SSH allowed IPs
        env:
          ADMIN_SSH_CIDR: ${{ vars.ADMIN_SSH_CIDR }}
        shell: bash
        run: |
          set -euo pipefail

          RUNNER_IP=$(curl -4 -fsS https://api.ipify.org)

          if [ -z "$ADMIN_SSH_CIDR" ]; then
            echo "ADMIN_SSH_CIDR GitHub variable is missing."
            exit 1
          fi

          echo "TF_VAR_github_runner_ip=${RUNNER_IP}/32" >> "$GITHUB_ENV"
          echo "TF_VAR_admin_ssh_cidr=${ADMIN_SSH_CIDR}" >> "$GITHUB_ENV"

          echo "Configured SSH access for GitHub runner and administrator."

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Validate configuration
        run: terraform validate

      - name: Generate Terraform plan
        run: terraform plan -input=false -no-color -out="$RUNNER_TEMP/tfplan"

      - name: Apply Terraform changes
        run: terraform apply -input=false -auto-approve "$RUNNER_TEMP/tfplan"

      - name: Install Ansible
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Configure SSH private key
        working-directory: .
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AZURE_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "AZURE_SSH_PRIVATE_KEY secret is missing."
            exit 1
          fi

          KEY_PATH="$RUNNER_TEMP/azure-vm"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"

          echo "ANSIBLE_PRIVATE_KEY_FILE=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Generate Ansible inventory
        env:
          TF_ADMIN_USERNAME: ${{ vars.TF_ADMIN_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail

          VM_IP=$(terraform output -raw public_ip_address)

          if [ -z "$VM_IP" ]; then
            echo "Terraform did not return a public IP."
            exit 1
          fi

          printf '[api]\n' > ../ansible/inventory.ini

          printf 'health-check-api-vm ansible_host=%s ansible_user=%s ansible_ssh_private_key_file=%s\n' \
            "$VM_IP" \
            "$TF_ADMIN_USERNAME" \
            "$ANSIBLE_PRIVATE_KEY_FILE" >> ../ansible/inventory.ini

          echo "Generated Ansible inventory for the Azure VM."

      - name: Wait for VM SSH
        working-directory: .
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible api \
            -i ansible/inventory.ini \
            -m ansible.builtin.wait_for_connection \
            -a "timeout=300"

      - name: Deploy application with Ansible
        working-directory: .
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook \
            -i ansible/inventory.ini \
            ansible/playbook.yaml