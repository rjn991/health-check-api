---
- name: Configure and deploy Health Check API
  hosts: api
  become: true

  vars:
    app_dir: /opt/health-check-api
    app_user: healthapi
    app_port: 8000

  tasks:
    - name: Install system dependencies
      ansible.builtin.apt:
        name:
          - python3
          - python3-venv
          - python3-pip
          - rsync
          - curl
        state: present
        update_cache: true

    - name: Create application user
      ansible.builtin.user:
        name: "{{ app_user }}"
        system: true
        create_home: true
        home: "{{ app_dir }}"
        shell: /usr/sbin/nologin

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_dir }}/app"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0755"

    - name: Synchronize application source
      ansible.posix.synchronize:
        src: ../app/
        dest: "{{ app_dir }}/app/"
        archive: false
        recursive: true
        delete: true
        checksum: true
        rsync_opts:
          - "--chown={{ app_user }}:{{ app_user }}"
      notify: Restart health-check-api

    - name: Copy requirements
      ansible.builtin.copy:
        src: ../requirements.txt
        dest: "{{ app_dir }}/requirements.txt"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0644"
      notify: Restart health-check-api

    - name: Create Python virtual environment
      ansible.builtin.command:
        cmd: python3 -m venv "{{ app_dir }}/venv"
        creates: "{{ app_dir }}/venv/bin/python"

    - name: Install Python dependencies
      ansible.builtin.pip:
        requirements: "{{ app_dir }}/requirements.txt"
        virtualenv: "{{ app_dir }}/venv"
      notify: Restart health-check-api

    - name: Install systemd service
      ansible.builtin.template:
        src: templates/health-check-api.service.j2
        dest: /etc/systemd/system/health-check-api.service
        owner: root
        group: root
        mode: "0644"
      notify: Restart health-check-api

    - name: Enable and start API service
      ansible.builtin.systemd:
        name: health-check-api
        enabled: true
        state: started
        daemon_reload: true

    - name: Install health-check script
      ansible.builtin.template:
        src: templates/health-check.sh.j2
        dest: /usr/local/bin/health-check-api.sh
        owner: root
        group: root
        mode: "0755"

    - name: Schedule health check every five minutes
      ansible.builtin.cron:
        name: "Health check for Health Check API"
        user: root
        minute: "*/5"
        job: "/usr/local/bin/health-check-api.sh"

  handlers:
    - name: Restart health-check-api
      ansible.builtin.systemd:
        name: health-check-api
        state: restarted
        daemon_reload: true